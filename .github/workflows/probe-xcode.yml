name: Probe Xcode versions
on:
  push:
    branches: [blender-ios]
    paths: ['.github/workflows/probe-xcode.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - run: |
          x=$(for a in /Applications/Xcode_27*.app; do [ -L "$a" ] || echo "$a"; done | sort -V | tail -1)
          sdk=$(DEVELOPER_DIR=$x/Contents/Developer xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK $sdk"
          H=$sdk/System/Library/Frameworks/UIKit.framework/Headers
          cat $H/UIViewReservedRegion.h | sed -n 25,70p; sed -n 20,40p $H/UISceneAccessoryRegistration.h
          for f in /dev/null; do
            echo "=================== $(basename $f)"
            grep -n -i -B2 -A2 'SceneAccessory\|hinge\|ReservedRegion\|cameraCapture\|API_AVAILABLE(ios(27' "$f" | head -150
          done
          grep -rn 'windowCameraCaptureAccessory\|CameraCaptureAccessory' $H | head
