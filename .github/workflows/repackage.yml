name: Blender iOS repackage

# Quick update of the last built IPA (add-ons, Info.plist) without recompiling Blender.
on:
  push:
    branches: [blender-ios]
    paths: ['.github/workflows/repackage.yml', 'addons/**']
  workflow_dispatch:

jobs:
  repackage:
    runs-on: macos-15
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci

      - name: Download the built IPA
        uses: actions/download-artifact@v4
        with:
          name: Blender-iOS-19
          run-id: 45052769669
          github-token: ${{ github.token }}
          path: in

      - name: Add the iPhone Duo add-ons
        run: |
          mkdir work && cd work
          unzip -q ../in/Blender-iOS.ipa
          app=Payload/Blender.app
          startup=$(find "$app" -type d -path '*scripts/startup' | head -1)
          echo "Startup scripts: $startup"
          [ -n "$startup" ] || exit 1
          cp ../ci/addons/duo_fold.py "$startup/"
          ls "$startup" | head -40
          codesign -f -s - "$app" || true
          zip -qr ../Blender-iOS.ipa Payload
          ls -la ..

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iOS-duo-${{ github.run_number }}
          path: Blender-iOS.ipa
