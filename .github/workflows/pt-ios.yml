name: P.T. iOS build

on:
  push:
    branches: [pt-ios]
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci

      - name: Tools
        run: |
          x=$(for a in /Applications/Xcode_27*.app; do [ -L "$a" ] || [ ! -d "$a" ] || echo "$a"; done | sort -V | tail -1)
          [ -n "$x" ] && sudo xcode-select -s "$x/Contents/Developer"
          xcodebuild -version
          brew install ninja shaderc vulkan-headers ccache || true
          which glslc

      - name: Get the port
        run: |
          git clone https://github.com/LoreanXavier/pt-pc.git pt
          cd pt
          git checkout -q 54144ac
          git log -1 --format='%h %ad %s' --date=short
          shopt -s nullglob
          for p in ../ci/patches/*.diff; do echo "Applying $p"; git apply --whitespace=nowarn "$p"; done

      - name: MoltenVK for iOS
        run: |
          curl -fsSL -o mvk.tar https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-ios.tar
          tar xf mvk.tar
          fw=$(find "$PWD/MoltenVK" -path '*dynamic*' -name MoltenVK.xcframework -type d | head -1)
          [ -n "$fw" ] || fw=$(find "$PWD/MoltenVK" -name MoltenVK.xcframework -type d | head -1)
          slice=$(find "$fw" -maxdepth 1 -type d -name 'ios-arm64' | head -1)
          echo "MoltenVK slice: $slice"; ls "$slice"
          echo "MVK_SLICE=$slice" >> "$GITHUB_ENV"

      - name: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ccache
          key: pt-ios-ccache-${{ github.run_number }}
          restore-keys: pt-ios-ccache-

      - name: Configure
        run: |
          cd pt
          vk_inc=$(brew --prefix vulkan-headers)/include
          cmake -G Ninja -B build/ios \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DVulkan_INCLUDE_DIR="$vk_inc" -DVulkan_GLSLC_EXECUTABLE="$(which glslc)" \
            -DVulkan_LIBRARY="$MVK_SLICE/MoltenVK.framework/MoltenVK" \
            -DPT_IOS=ON -DPT_METALFX=ON \
            2>&1 | tee ../configure.log | tail -60
          # Lua's os.execute: system() does not exist on iOS (and the game's scripts don't run programs)
          sed -i '' 's/system(luaL_optstring(L, 1, NULL))/-1/' build/ios/_deps/lua51-src/src/loslib.c

      - name: Build
        run: |
          cd pt
          export CCACHE_DIR=~/Library/Caches/ccache
          set -o pipefail
          ninja -C build/ios -k 0 pt 2>&1 | tee ../build.log | grep -E 'error|FAILED' | head -200 || true
          test -e build/ios/pt || test -d build/ios/pt.app

      - name: App bundle
        run: |
          b=pt/build/ios
          echo "Build folder:"; ls -la $b | grep -v '\.ninja\|CMake\|\.cmake' | head -60
          app=out/Payload/PT.app
          # On iOS CMake makes pt a bundle (pt.app/pt); its runtime files land next to the executable.
          echo "pt.app:"; ls -la $b/pt.app | head -40
          mkdir -p out/Payload
          cp -R $b/pt.app $app
          rm -f $app/Info.plist
          mkdir -p $app/Frameworks
          cp -R "$MVK_SLICE/MoltenVK.framework" $app/Frameworks/
          for d in shaders voice fonts survival licenses; do [ -d $b/$d ] && [ ! -d $app/$d ] && cp -R $b/$d $app/; done
          [ -f $b/extras.pak ] && [ ! -f $app/extras.pak ] && cp $b/extras.pak $app/
          rm -f $app/libMoltenVK.dylib
          rm -f $app/shaders/*.glsl $app/shaders/*.d 2>/dev/null || true
          cp pt/README.md $app/ || true
          ls -d $b/shaders $b/voice 2>/dev/null; ls $b/shaders | head -5; ls $b/voice | head -20
          python3 - "$app/Info.plist" "${{ github.run_number }}" <<'PY'
          import plistlib, sys
          plistlib.dump({
              "CFBundleExecutable": "pt", "CFBundleIdentifier": "com.livejasminw.pt",
              "CFBundleName": "P.T.", "CFBundleDisplayName": "P.T.", "CFBundlePackageType": "APPL",
              "CFBundleShortVersionString": "1.0", "CFBundleVersion": sys.argv[2],
              "CFBundleInfoDictionaryVersion": "6.0", "CFBundleSupportedPlatforms": ["iPhoneOS"],
              "MinimumOSVersion": "17.0", "UIDeviceFamily": [1, 2], "UILaunchScreen": {},
              "UIRequiresFullScreen": True, "UIStatusBarHidden": True,
              "UIFileSharingEnabled": True, "LSSupportsOpeningDocumentsInPlace": True,
              "UISupportedInterfaceOrientations": ["UIInterfaceOrientationLandscapeLeft",
                  "UIInterfaceOrientationLandscapeRight", "UIInterfaceOrientationPortrait"],
              "NSMicrophoneUsageDescription": "P.T. listens for one spoken word in one part of the game, as on the PS4.",
              "GCSupportsControllerUserInteraction": True,
              "DTPlatformName": "iphoneos", "DTSDKName": "iphoneos27.2",
          }, open(sys.argv[1], "wb"))
          PY
          printf 'APPL????' > $app/PkgInfo
          cat > ent.plist <<'PL'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>com.apple.developer.kernel.increased-memory-limit</key><true/>
          </dict></plist>
          PL
          sed -i '' 's/^          //' ent.plist
          find $app \( -name '*.dylib' -o -name '*.so' \) -exec codesign -f -s - {} \;
          codesign -f -s - $app/Frameworks/MoltenVK.framework
          codesign -f -s - --entitlements ent.plist $app
          du -sh $app; ls $app
          (cd out && zip -qr PT-iOS.ipa Payload)

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PT-iOS-${{ github.run_number }}
          path: out/PT-iOS.ipa

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/ccache
          key: pt-ios-ccache-${{ github.run_number }}

      - name: Show errors
        if: failure()
        run: |
          grep -n -B2 -A10 'CMake Error' configure.log | head -120 || true
          grep -n -A6 'error:' build.log | head -300 || true
          echo ---- tail; tail -40 build.log 2>/dev/null || true

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pt-ios-logs-${{ github.run_number }}
          path: |
            configure.log
            build.log
